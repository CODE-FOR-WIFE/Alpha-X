# Deploy demo/ to a Vercel Hobby project via CLI.
# Required environment secrets (GitHub Environment: development):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Token scope must be the team (or full account), not a single project —
# project-scoped tokens make `vercel pull` fail with "Could not retrieve Project Settings".

name: Deploy Vercel

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/deploy-vercel.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Vercel secrets
        run: |
          {
            echo "VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '[:space:]')"
            echo "VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '[:space:]')"
            echo "VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"

      - name: Check Vercel secrets
        run: |
          missing=0
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is empty"; missing=1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::VERCEL_ORG_ID is empty"; missing=1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::VERCEL_PROJECT_ID is empty"; missing=1; }
          echo "ORG prefix=${VERCEL_ORG_ID:0:5} length=${#VERCEL_ORG_ID}"
          echo "PROJECT prefix=${VERCEL_PROJECT_ID:0:4} length=${#VERCEL_PROJECT_ID}"
          case "$VERCEL_ORG_ID" in
            team_*) ;;
            *) echo "::warning::VERCEL_ORG_ID should start with team_" ;;
          esac
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            *) echo "::error::VERCEL_PROJECT_ID must start with prj_ (not the project name)"; missing=1 ;;
          esac
          if [ "$missing" -ne 0 ]; then
            echo "Fix secrets on GitHub Environment: development"
            exit 1
          fi

      - name: Verify Vercel project access
        run: |
          code=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "GET /v9/projects status=$code"
          if [ "$code" != "200" ]; then
            echo "::error::Vercel API rejected the token or project ids (HTTP $code)."
            echo "Recreate VERCEL_TOKEN at https://vercel.com/account/settings/tokens"
            echo "Scope = the Hobby team (not a single project)."
            python3 -c "import json; d=json.load(open('/tmp/vercel-project.json')); print(d.get('error', d))"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('/tmp/vercel-project.json')); print('Linked project:', d.get('name'), d.get('id'))"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project
        working-directory: demo
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy to Vercel
        id: deploy
        working-directory: demo
        env:
          IS_PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          ARGS=(--yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")
          if [ "$IS_PRODUCTION" = "true" ]; then
            ARGS+=(--prod)
          fi
          URL=$(vercel deploy "${ARGS[@]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `**Vercel preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.body?.includes('**Vercel preview:**') && comment.user?.type === 'Bot',
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
